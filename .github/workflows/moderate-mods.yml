# Удаление мода по жалобе.
# Жалобу создаёт игрок кнопкой 🚩 (метка report). Модератор, проверив мод, добавляет метку approved-removal.
# Только участник с правами write/maintain/admin может запустить удаление.
name: Модерация модов
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  remove-mod:
    if: github.event.label.name == 'approved-removal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const sender = context.payload.sender.login;

            // 1. Проверяем, что метку поставил модератор
            const perm = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: sender });
            if (!['admin', 'maintain', 'write'].includes(perm.data.permission)) {
              core.setFailed(`${sender} не модератор`);
              return;
            }

            // 2. Берём путь к файлу из служебной метки в тексте жалобы (только mods/<имя>.json)
            const m = (issue.body || '').match(/<!-- mod-file: (mods\/[\w.-]+\.json) -->/);
            if (!m) {
              core.setFailed('В жалобе нет метки файла мода');
              return;
            }
            const path = m[1];
            const fname = path.split('/').pop();

            // 3. Удаляем файл мода
            let file = null;
            try { file = await github.rest.repos.getContent({ owner, repo, path }); } catch (e) { file = null; }
            if (file) {
              await github.rest.repos.deleteFile({
                owner, repo, path, sha: file.data.sha,
                message: `Удалён мод ${fname} по жалобе #${issue.number}`
              });
            }

            // 4. Убираем мод из index.json, если он есть
            try {
              const idx = await github.rest.repos.getContent({ owner, repo, path: 'mods/index.json' });
              const json = JSON.parse(Buffer.from(idx.data.content, 'base64').toString('utf8'));
              const arr = Array.isArray(json) ? json : (json.mods || []);
              const left = arr.filter(x => x && x.file !== fname);
              const out = Array.isArray(json) ? left : Object.assign({}, json, { mods: left });
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: 'mods/index.json', sha: idx.data.sha,
                message: `Убран из каталога: ${fname}`,
                content: Buffer.from(JSON.stringify(out, null, 2) + '\n').toString('base64')
              });
            } catch (e) {
              core.info('index.json не обновлён: ' + e.message);
            }

            // 5. Комментарий и закрытие жалобы
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: file ? `Мод ${path} удалён модератором.` : `Файл ${path} уже не найден в репозитории.`
            });
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
